# ==============================================================================
# QLoRA & CoT Distillation Configuration
# Project: Efficient Chain-of-Thought (CoT) Distillation in Small Language Models
# Target Compute: Kaggle Free GPU Tier (Dual T4 16GB / Single P100 16GB)
# ==============================================================================

project:
  name: "cot-slm-distillation"
  experiment_name: "qwen2.5-3b-bespoke-stratos"
  seed: 42

data:
  dataset_name: "HuggingFaceH4/Bespoke-Stratos-17k"
  fallback_dataset_name: "Magpie-Align/Magpie-Reasoning-V2-250K-CoT-Deepseek-R1-Llama-70B"
  n_samples: 5000
  train_ratio: 0.9
  output_dir: "data"
  train_file: "data/train.jsonl"
  test_file: "data/test.jsonl"

model:
  base_model_name: "unsloth/Qwen2.5-3B"
  fallback_model_name: "unsloth/Llama-3.2-3B"
  model_type: "qwen"
  max_seq_length: 2048
  load_in_4bit: true
  dtype: null  # Auto-detect (float16 on T4/P100, bfloat16 on Ampere+)

qlora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  use_gradient_checkpointing: "unsloth"

training:
  output_dir: "models/qwen2.5-3b-cot-qlora"
  learning_rate: 0.0002
  lr_scheduler_type: "cosine"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  warmup_ratio: 0.05
  weight_decay: 0.01
  fp16: true
  bf16: false
  packing: true
  logging_steps: 10
  eval_steps: 250
  save_steps: 500
  save_total_limit: 2
  early_stopping_patience: 3

evaluation:
  gsm8k_samples: 100
  arc_samples: 100
  cot_test_samples: 100
  temperature: 0.0
  max_new_tokens: 256
  results_dir: "results"
